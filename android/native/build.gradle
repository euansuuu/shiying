// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
    }
}

// shortcut: Capacitor 7.6.8 sources also compile with Java 17; recheck when upgrading Capacitor.
subprojects {
    afterEvaluate { child ->
        if (child.plugins.hasPlugin('com.android.application') || child.plugins.hasPlugin('com.android.library')) {
            child.android.buildToolsVersion = '35.0.0'
            child.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            child.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
